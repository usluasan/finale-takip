<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finale Takibi</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#164e63,#06b6d4);font-family:system-ui,Segoe UI,sans-serif}
form{background:#fff;border-radius:16px;padding:30px;width:min(92vw,420px);display:flex;flex-direction:column;gap:12px}h1{margin:0;color:#0e7490}p{margin:0;color:#556;font-size:14px}
input{padding:12px;border:1px solid #ccd;border-radius:8px;font-size:16px}button{padding:12px;border:0;border-radius:8px;background:#0e7490;color:#fff;font-size:15px;font-weight:600;cursor:pointer}.e{color:#b5481a;font-size:13px;min-height:16px}</style>
<form id="f"><h1>Finale Takibi</h1><p>Sunucu adresini girin (ör. https://finale.sirketim.com veya http://192.168.1.20:8080)</p><div class="e" id="e"></div><input id="u" placeholder="Sunucu adresi" autofocus><button>Kaydet ve bağlan</button></form>
<script>if(/err=1/.test(location.search))document.getElementById('e').textContent='Sunucuya ulaşılamadı. Adresi kontrol edin.';
finaleDesktop.getUrl().then(function(u){document.getElementById('u').value=u});
document.getElementById('f').onsubmit=function(e){e.preventDefault();finaleDesktop.setUrl(document.getElementById('u').value)}</script></html>
