# Finale Takibi — NPM'deki apps.finale.com.tr kaydının "Advanced" (gelişmiş) ayarına eklenecek blok.
# Yayın adresi: https://apps.finale.com.tr/finale/
# Upstream adı değişkenle çözülür: Finale konteyneri kapalı olsa bile NPM nginx'i açılır, diğer siteler etkilenmez.
# Önek (/finale) burada kaldırılır; uygulama kendi içinde göreli yol kullanır.

location = /finale { absolute_redirect off; return 308 /finale/$is_args$args; }   # göreli yönlendirme: şema/port korunur

location ^~ /finale/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $finale_up finale-takip:8080;
    rewrite ^/finale/(.*)$ /$1 break;
    proxy_pass http://$finale_up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;                       # deneme sınırı istemci IP'sini buradan okur (taklit edilemez)
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;                    # https -> oturum çerezi Secure olur
    proxy_set_header X-Forwarded-Prefix /finale;
    proxy_buffering off;                                           # canlı güncelleme (SSE, api/events)
    proxy_read_timeout 1h;                                         # SSE bağlantısı uzun süre açık kalır
    client_max_body_size 30m;                                      # dosya yükleme sınırı sunucuyla aynı
}
